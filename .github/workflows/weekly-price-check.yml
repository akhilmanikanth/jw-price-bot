name: Scheduled price check

on:
  schedule:
    # Tuesday AND Friday, 3:00 PM Australia/Sydney.
    # Sydney is UTC+11 during AEDT (Oct-Apr) and UTC+10 during AEST (Apr-Oct),
    # so both UTC slots are scheduled for each day. The `--only-if-due` guard
    # runs the check only in the correct one, and the duplicate-notification
    # guard is the backstop if GitHub delays a run into the other window.
    - cron: "0 4 * * 2"   # Tue 15:00 AEDT
    - cron: "0 5 * * 2"   # Tue 15:00 AEST
    - cron: "0 4 * * 5"   # Fri 15:00 AEDT
    - cron: "0 5 * * 5"   # Fri 15:00 AEST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and print only - do not send to Telegram"
        type: boolean
        default: false
      force:
        description: "Ignore the duplicate-notification guard"
        type: boolean
        default: true
      log_level:
        description: "Log level"
        type: choice
        options: [INFO, DEBUG]
        default: INFO

concurrency:
  group: weekly-price-check
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Australia/Sydney' }}
      SCHEDULE_DAYS: ${{ vars.SCHEDULE_DAYS || 'tue,fri' }}
      SCHEDULE_HOUR: ${{ vars.SCHEDULE_HOUR || '15' }}
      SCHEDULE_MINUTE: ${{ vars.SCHEDULE_MINUTE || '0' }}
      ENABLED_RETAILERS: ${{ vars.ENABLED_RETAILERS }}
      USE_PLAYWRIGHT: "true"
      LOG_LEVEL: ${{ github.event.inputs.log_level || 'INFO' }}
      HISTORY_PATH: data/history.json
      DEBUG_DUMP_DIR: debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-core.txt') }}

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Show current Sydney time
        run: TZ=$TIMEZONE date

      - name: Run price check
        id: run
        run: |
          ARGS="check --tolerate-failure"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --only-if-due"
          else
            [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
            [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run --manual"
          fi
          echo "Running: python main.py $ARGS"
          python main.py $ARGS

      - name: Upload logs and debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jwbot-logs-${{ github.run_number }}
          path: |
            logs/
            debug/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated price history
        if: github.event_name == 'schedule' || github.event.inputs.dry_run != 'true'
        run: |
          if [ -z "$(git status --porcelain data/history.json)" ]; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "chore: record price check $(TZ=$TIMEZONE date +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

  # Loud failure: if the check job fails for any reason, say so on Telegram
  # immediately rather than going silent until someone looks at Actions.
  # (Bot-protection blocks are NOT failures - the run reports those in the
  # message itself and still exits 0.)
  notify-failure:
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Telegram failure alert
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS --fail -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d disable_web_page_preview=true \
            --data-urlencode "text=⚠️ Price check FAILED (run #${{ github.run_number }}). Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
